name: AI40 Coding Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify types
        run: pnpm check
      - name: Verify lint
        run: pnpm lint
      - name: Run tests
        run: pnpm test

      # This workflow deliberately does not build or sign an APK. Enable a separate
      # release workflow only after defining Android credentials and a reviewed EAS/Gradle path.
